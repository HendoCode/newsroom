# Trivy secret-scanner config for the CMW security gate (deploy/security-gate.sh's
# `trivy fs --scanners secret` step). See deploy/README.md for the gate's full design.
#
# The compose files (docker-compose.yml, infra/aws-poc/templates/docker-compose.prod.yml.tpl)
# reference secrets via shell/Terraform env-var interpolation — e.g. ${ANTHROPIC_API_KEY:-},
# the Terraform-escaped $${NEXTAUTH_SECRET} — never a literal secret value. Empirically verified
# (2026-08-12, against the real tracked tree — see deploy/README.md's smoke-run) that Trivy's
# built-in rules do NOT currently flag these patterns: 0 secret findings today. This allow-rule is
# a defensive backstop, not a fix for an active false positive — it exists so a future change to
# Trivy's built-in ruleset can't turn an env-var *reference* into a blocking "secret" finding
# without a human noticing (the rule only matches the interpolation syntax itself, so a real
# secret sitting next to one is still caught).
allow-rules:
  - id: shell-env-var-interpolation
    description: >-
      Shell or Terraform environment-variable interpolation reference (${VAR}, ${VAR:-default},
      or Terraform-escaped $${VAR}) — a runtime-resolved reference, not a literal secret value.
    regex: '^\$\{?\$?\{[A-Za-z_][A-Za-z0-9_]*(:-[^}]*)?\}$'
