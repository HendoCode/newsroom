spec_version: "0.1.0"
name: masthead-public
version: 1.0.0
description: >
  Git-native Masthead — public demo instance.
  Orchestrates disciplined turn-taking through oracle, interview, draft,
  council, and lessons — reading raw markdown persona files and engine
  steps verbatim as system prompt blocks. Ships a neutral demo suite
  (two fictional author voices, an interviewer panel, a quality council);
  personal voice packs live in a private production instance, never here.

model:
  preferred: "openrouter:google/gemini-2.5-flash"
  fallback:
    - "google:gemini-2.5-flash"
    - "anthropic:claude-sonnet-4-5-20250929"
    - "openrouter:anthropic/claude-3.5-sonnet"
    - "openai:gpt-4o"
  constraints:
    temperature: 0.7
    max_tokens: 8192

tools:
  - read
  - write
  - cli
  - memory

runtime:
  max_turns: 56
  timeout: 300

compliance:
  risk_level: medium
  human_in_the_loop: true
  data_classification: public-demo
