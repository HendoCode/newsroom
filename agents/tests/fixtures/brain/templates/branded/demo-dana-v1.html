<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<!--
  Branded distribution template — demo-dana-v1 (D13; cmw-open-decisions Item 5).
  This file is the *template*, versioned here in Git (agents/app/render/template.py reads it +
  its commit sha). The branded HTML/PDF it produces at finalize are DISPOSABLE renders — never
  committed (domain model §1.19: BrandedTemplate is versioned, BrandedRender is not).

  Brand tokens ({{TOKENS_CSS}}, {{FONT_IMPORT}}, {{LOGO_SRC}}) are injected at render time,
  DERIVED from content-machine-agent/voice/demo-dana/visual-identity.md — the single source of
  truth. Do not hand-edit colors/fonts here; edit visual-identity.md and re-render (Item 5: brand
  tokens are derived, never duplicated).
-->
{{FONT_IMPORT}}
<style>
  :root {
{{TOKENS_CSS}}
  }
  * { box-sizing: border-box; }
  body {
    font: 15px/1.7 var(--font-sans, 'Josefin Sans', system-ui, sans-serif);
    color: hsl(var(--foreground));
    background: hsl(var(--background));
    margin: 0;
    padding: 0;
  }
  .branded-page { max-width: 760px; margin: 0 auto; padding: 0 1.5rem 4rem; }
  .branded-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 2rem 0 1.5rem;
    margin-bottom: 1.5rem;
    border-bottom: 1px solid hsl(var(--border));
  }
  .branded-header img { height: 28px; width: auto; }
  h1, h2, h3, h4, h5, h6 {
    font-family: var(--font-serif, 'Josefin Sans', Georgia, serif);
    letter-spacing: -0.02em;
    color: hsl(var(--foreground));
  }
  h1 { font-size: 2rem; font-weight: 700; line-height: 1.2; margin: 0 0 1.25rem; }
  h2 { font-size: 1.4rem; font-weight: 700; margin: 2.25rem 0 0.75rem; }
  h3 { font-size: 1.15rem; font-weight: 700; margin: 1.75rem 0 0.6rem; }
  p, li { margin: 0 0 1.1rem; }
  a { color: hsl(var(--primary)); }
  code, pre { font-family: var(--font-mono, 'JetBrains Mono', 'Fira Code', monospace); }
  figure { margin: 2rem 0; text-align: center; }
  figure svg, figure img {
    max-width: 100%;
    height: auto;
    border: 1px solid hsl(var(--border));
    border-radius: var(--radius, 12px);
  }
  figcaption { font-size: 0.85rem; color: hsl(var(--muted-foreground)); margin-top: 0.6rem; text-align: left; }
  hr { border: none; border-top: 1px solid hsl(var(--border)); margin: 2.5rem 0; }
  table { border-collapse: collapse; width: 100%; margin: 0 0 1.1rem; }
  th {
    text-align: left;
    text-transform: uppercase;
    font-size: 0.72rem;
    letter-spacing: 0.05em;
    color: hsl(var(--muted-foreground));
    padding: 0.45rem 0.6rem;
    border-bottom: 2px solid hsl(var(--border));
  }
  td { padding: 0.45rem 0.6rem; border-bottom: 1px solid hsl(var(--border)); vertical-align: top; }
  .branded-footer {
    margin-top: 3rem;
    padding-top: 1.25rem;
    border-top: 1px solid hsl(var(--border));
    font-size: 0.78rem;
    color: hsl(var(--muted-foreground));
  }
  @media print {
    .branded-page { max-width: none; padding: 0 0.5in; }
    .branded-header, .branded-footer { break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="branded-page">
  <header class="branded-header">
    <img src="{{LOGO_SRC}}" alt="Hendo" />
  </header>
  <main>
{{ARTICLE_HTML}}
  </main>
  <footer class="branded-footer">
    <p>Rendered {{RENDERED_AT}} &middot; source revision {{SOURCE_REVISION}} &middot; template {{TEMPLATE_VERSION}}</p>
  </footer>
</div>
</body>
</html>
