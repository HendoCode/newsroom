[project]
name = "newsroom-agents"
version = "0.1.0"
description = "FastAPI service hosting the deterministic orchestration state machine and LLM-facing work (docs/design.md D5, §6)."
requires-python = ">=3.12"
# Runtime deps are pinned in requirements.txt for the Docker build; this file exists so the
# package is importable and tooling (pytest) can discover it.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
